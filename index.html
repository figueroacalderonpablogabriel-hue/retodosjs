<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Libreta de notas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="contenedor">
        <h1>Libreta de notas</h1>
        <p>Registra hasta 10 alumnos con sus tres certámenes. Se aprueba con promedio de 55 o más.</p>
        
        <section class="tarjeta">
            <h2>Agregar alumno</h2>
            <p id="contador-alumnos">0 de 10 alumnos</p>
            
            <form id="form-alumno">
                <div class="campo">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" placeholder="Ej: Carlos Pérez" autocomplete="off">
                </div>
                <div class="campo">
                    <label for="c1">Certamen 1</label>
                    <input type="number" id="c1" placeholder="0 a 100" min="0" max="100">
                </div>
                <div class="campo">
                    <label for="c2">Certamen 2</label>
                    <input type="number" id="c2" placeholder="0 a 100" min="0" max="100">
                </div>
                <div class="campo">
                    <label for="c3">Certamen 3</label>
                    <input type="number" id="c3" placeholder="0 a 100" min="0" max="100">
                </div>
                
                <div class="botones">
                    <button type="submit" id="btn-agregar">Agregar alumno</button>
                    <button type="button" id="btn-borrar">Borrar todo</button>
                </div>
            </form>
        </section>

        <section class="tarjeta">
            <div id="resultado"></div>
        </section>
    </main>

    <!-- Importante: type="module" para conectar los archivos JS -->
    <script type="module" src="main.js"></script>
</body>
</html>
